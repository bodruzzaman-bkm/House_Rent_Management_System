{% extends 'base.html' %}
{% block content %}
<h2>Monthly Bill Generation</h2>
<form method="POST" action="/generate_bill">
<label>Agreement</label>
<select name="agreement_id" required>
{% for row in agreements %}
<option value="{{ row.agreement_id }}">Agreement {{ row.agreement_id }} | Flat {{ row.flat_id }}</option>
{% endfor %}
</select>
<label>Billing Month</label>
<input type="month" name="billing_month" required>
<label>Electricity</label>
<input type="number" step="0.01" name="electricity" required>
<label>Gas</label>
<input type="number" step="0.01" name="gas" required>
<label>Maintenance</label>
<input type="number" step="0.01" name="maintainance" required>
<button type="submit">Generate Bill</button>
</form>
{% endblock %}
